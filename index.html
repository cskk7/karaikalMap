<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karthikesavan GIS Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="Karaikal GIS map"></div>

      <button id="panelToggle" class="panel-toggle" type="button" aria-label="Open map tools" aria-expanded="false" title="Open map tools">
        <span class="brand-mark compact"></span>
      </button>

      <section id="toolsPanel" class="panel collapsed" aria-label="Map tools">
        <button id="panelClose" class="panel-close" type="button" aria-label="Close map tools" title="Close map tools">&times;</button>
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Karthikesavan GIS</h1>
            <p>Village and survey boundary viewer</p>
          </div>
        </div>

        <div class="tool-grid">
          <button id="locateBtn" class="icon-button" type="button" title="Locate me" aria-label="Locate me">&#8982;</button>
          <button id="measureLineBtn" class="icon-button" type="button" title="Measure distance" aria-label="Measure distance">&#8596;</button>
          <button id="measureAreaBtn" class="icon-button" type="button" title="Measure area" aria-label="Measure area">&#9633;</button>
          <button id="clearMeasureBtn" class="icon-button" type="button" title="Clear measurements" aria-label="Clear measurements">&times;</button>
        </div>

        <!-- <form id="placeSearchForm" class="search-form">
          <label for="placeSearch">Place search</label>
          <div class="search-row">
            <input id="placeSearch" type="search" placeholder="Search address or place">
            <button type="submit">Search</button>
          </div>
        </form> -->

        <div class="search-form">
          <label for="featureSearch">Village search</label>
          <div class="search-row">
            <input id="featureSearch" type="search" list="villageList" placeholder="Search feature">
            <button id="featureSearchBtn" type="button">Go</button>
          </div>
          <datalist id="villageList"></datalist>
        </div>

        <div class="search-form">
          <label for="surveySearch">Survey number search</label>
          <div class="search-row">
            <input id="surveySearch" type="search" list="surveyList" placeholder="Select village first" disabled>
            <button id="surveySearchBtn" type="button" disabled>Go</button>
          </div>
          <datalist id="surveyList"></datalist>
        </div>

        <div class="layers-panel">
          <h2>Layers</h2>
          <label><input type="radio" name="baseLayer" value="satellite" checked> Google Satellite</label>
          <label><input type="radio" name="baseLayer" value="osm"> OpenStreetMap</label>
          <label><input id="villageLayerToggle" type="checkbox" checked> Karaikal Village Boundary</label>
          <label><input id="surveyLayerToggle" type="checkbox" checked> Karaikal Survey Boundary</label>
        </div>
      </section>

      <div id="popup" class="popup" role="dialog" aria-live="polite">
        <button id="popupCloser" type="button" aria-label="Close popup">&times;</button>
        <div id="popupContent"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
    <script src="./layers/KaraikalSurveyBoundary_2.js"></script>
    <script src="./layers/KaraikalVillageBoundary_3.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
